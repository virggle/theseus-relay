<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="WtPrmPYQZhQZYqJfGlwzqa">
<head data-page-node-id="40NDUSWO0C9NroUyotLiRg">
<meta charset="UTF-8" data-page-node-id="cyKsFYsKEJerQFq0WDXSDW">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="gkCsclhWUsfmBq8F4rGJ8b">
<title>忒修斯号 · Theseus Relay</title>
<style>
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#26262A; --ink2:#5F5E5A; --ink3:#8A8982;
  --line:rgba(38,38,42,.12); --accent:#185FA5; --accent-soft:#E6F1FB;
  --amber:#854F0B; --amber-soft:#FAEEDA; --teal:#0F6E56; --teal-soft:#E1F5EE;
  --red:#A32D2D; --red-soft:#FCEBEB; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:var(--ink)}

/* ---------- 布局 ---------- */
#app{display:flex;flex-direction:column;height:100vh;max-width:1120px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header .logo{font-weight:500;font-size:15px}
header .tag{font-size:12px;color:var(--ink3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2)}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

#main{display:flex;flex:1;min-height:0}
#chatCol{flex:1;display:flex;flex-direction:column;min-width:0}
#backstage{display:none;width:340px;border-left:1px solid var(--line);background:var(--card);overflow-y:auto;flex-shrink:0}
#backstage.open{display:block}
@media(max-width:860px){
  #backstage{position:fixed;right:0;top:53px;bottom:0;z-index:30;box-shadow:-4px 0 16px rgba(0,0,0,.08);width:min(340px,92vw)}
}

/* ---------- 聊天 ---------- */
#log{flex:1;overflow-y:auto;padding:24px 20px 8px}
.empty{color:var(--ink3);text-align:center;margin-top:18vh;font-size:13px}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:8px;font-weight:500}
.empty p{max-width:420px;margin:0 auto}
.msg{display:flex;flex-direction:column;margin-bottom:14px}
.msg.user{align-items:flex-end}
.bubble{max-width:78%;padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;word-break:break-word}
.bubble code,.bs-pre code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.msg.bot .bubble code{background:var(--accent-soft)}
.msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-items:flex-start}
.msg.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.who{font-size:11px;color:var(--ink3);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--teal);background:var(--teal-soft);border-radius:99px;padding:2px 10px;margin-top:6px;cursor:default}
.chip.warn{color:var(--amber);background:var(--amber-soft)}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:11px;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line)}
.divider .d-baton{color:var(--amber)}

/* ---------- 输入区 ---------- */
#composer{padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--card)}
#quick{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qbtn{font-size:12px;color:var(--ink2);border:1px dashed var(--line);border-radius:99px;padding:4px 12px;background:var(--bg)}
.qbtn:hover{color:var(--accent);border-color:var(--accent)}
#row{display:flex;gap:10px}
#input{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);outline:none;max-height:120px}
#input:focus{border-color:var(--accent)}
#send{background:var(--accent);color:#fff;border-radius:10px;padding:0 22px;font-size:14px}
#send:disabled{opacity:.5;cursor:wait}

/* ---------- 后台面板 ---------- */
#backstage h3{font-size:13px;font-weight:500;padding:14px 16px 6px;color:var(--ink2)}
.bs-card{margin:0 12px 10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.bs-card.live{border-color:var(--amber);background:var(--amber-soft)}
.bs-card h4{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.bs-sub{font-size:12px;color:var(--ink2);margin-top:4px}
.bs-detail{margin-top:8px}
.bs-detail summary{font-size:12px;color:var(--accent);cursor:pointer;user-select:none}
.bs-pre{font-size:12px;white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;max-height:260px;overflow-y:auto;color:var(--ink)}
.bs-meta{font-size:11px;color:var(--ink3);margin-top:6px}
.bs-stat{font-size:12px;color:var(--ink2);margin:8px 16px 14px;padding:10px 12px;border-radius:var(--radius);background:var(--accent-soft)}

/* ---------- 设置弹窗 ---------- */
#mask{display:none;position:fixed;inset:0;background:rgba(38,38,42,.35);z-index:50;align-items:center;justify-content:center}
#mask.open{display:flex}
#modal{width:min(460px,94vw);background:var(--card);border-radius:16px;padding:22px;max-height:88vh;overflow-y:auto}
#modal h2{font-size:16px;font-weight:500;margin-bottom:4px}
#modal .tip{font-size:12px;color:var(--ink3);margin-bottom:14px}
.builtin{font-size:12px;color:var(--teal);background:var(--teal-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.mrow{display:flex;gap:10px;margin-top:16px}
.mbtn{flex:1;padding:9px 0;border-radius:10px;font-size:13px;border:1px solid var(--line);color:var(--ink2)}
.mbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#testResult{font-size:12px;margin-top:10px;display:none;padding:6px 10px;border-radius:8px}
#testResult.ok{display:block;color:var(--teal);background:var(--teal-soft)}
#testResult.bad{display:block;color:var(--red);background:var(--red-soft)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
#toast.show{opacity:.92}
.cost{margin:10px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.cost-head{font-size:12px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cost-model{font-weight:400;font-size:11px;color:var(--ink3)}
.cost-row{display:flex;gap:8px;margin-top:8px}
.cost-cell{flex:1;background:var(--bg);border-radius:8px;padding:6px 8px}
.cost-cell .k{display:block;font-size:10px;color:var(--ink3)}
.cost-cell b{font-size:13px;color:var(--ink)}
.cost-cell b.good{color:var(--teal)}
.cost-cell b.bad{color:var(--red)}
#costChart{width:100%;height:70px;margin-top:8px;display:block}
.cost-note{margin-top:6px;font-size:10px;color:var(--ink3);line-height:1.5}
.cost-legend{display:flex;gap:10px;font-size:10px;color:var(--ink3);margin-top:4px}
.cost-legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:4px}
</style>
</head>

<script>
const $ = (s) => document.querySelector(s);
const logEl = $('#log'), inputEl = $('#input'), sendBtn = $('#send');

let sid = localStorage.getItem('theseus_sid') || '';
let profile = JSON.parse(localStorage.getItem('theseus_profile') || 'null');
let builtin = null;
let batons = [];
let busy = false;
let mode = 'relay'; // 忒修斯模式唯一；字段保留以便兼容旧数据
let backendOk = false;

// 服务商预设兜底：后端不在时（如直接打开 HTML 文件）设置弹窗也不至于空白
const FALLBACK_PRESETS = {
  deepseek: { label: 'DeepSeek', baseUrl: 'https://api.deepseek.com', models: ['deepseek-chat', 'deepseek-reasoner'] },
  openai: { label: 'OpenAI', baseUrl: 'https://api.openai.com/v1', models: ['gpt-4o-mini', 'gpt-4o', 'gpt-3.5-turbo'] },
  openrouter: { label: 'OpenRouter（免费档需自备 key）', baseUrl: 'https://openrouter.ai/api/v1', models: ['openai/gpt-oss-120b'] },
  ollama: { label: '本地 Ollama', baseUrl: 'http://localhost:11434/v1', models: ['llama3', 'qwen2.5'] },
  other: { label: '其他（自定义）', baseUrl: '', models: [] },
};

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
function fmtTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---------- 渲染 ----------
// 1) 归一化模型输出的字面量转义（\n 等）→ 真实换行  2) 轻量排版：## 标题 / **粗体** / `代码`
function fmt(t) {
  let s = String(t ?? '').replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
  s = esc(s);
  s = s.replace(/^###?\s?(.+)$/gm, '<b>$1</b>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return s;
}
function renderDivider(agentId, handoffLen) {
  const div = document.createElement('div');
  const info = handoffLen != null ? `，留下 <b class="d-baton">${handoffLen}</b> 字简报后离场` : '';
  div.innerHTML = `<span>换棒 · 第${agentId-1}棒已离场${info} → <b class="d-baton">第${agentId}棒上线</b>，只知道简报 + 你的最新消息</span>`;
  return div;
}
function badgeOf(agentId, m) {
  if (m === 'single' || !agentId) return '常驻助手';
  return `第${agentId}棒`;
}
function renderMsg(role, agentId, text, extraHTML, m) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  let inner = '';
  if (role !== 'user') inner += `<div class="who"><span class="badge">${badgeOf(agentId, m)}</span><span>${fmtTime(Date.now())}</span></div>`;
  inner += `<div class="bubble">${fmt(text)}</div>` + (extraHTML || '');
  wrap.innerHTML = inner;
  return wrap;
}
function scrollBottom() { logEl.scrollTop = logEl.scrollHeight; }

function renderBackstage() {
  const list = $('#bsList');
  $('#liveStat').textContent = batons.length
    ? `第 ${batons.length} 棒在棒 · 已换代 ${batons.length - 1} 次 · 完整 log 谁都没读过`
    : '每轮换棒 · Agent 只读简报，不读历史';
  $('#bsStat').innerHTML = batons.length
    ? `已换代 <b>${batons.length - 1}</b> 次 · 完整对话共 ${batons.length * 2} 条记录，<b>但没有任何一个 Agent 读过它</b>（除非它用了翻日志）`
    : '还没有换棒记录';
  list.innerHTML = '';
  for (let i = batons.length - 1; i >= 0; i--) {
    const b = batons[i];
    const live = i === batons.length - 1;
    const card = document.createElement('div');
    card.className = 'bs-card' + (live ? ' live' : '');
    const qHtml = (b.logQueries || []).map(q =>
      `<div class="bs-sub" style="color:var(--teal)">翻日志：「${esc(q.query)}」→ ${q.hits.length} 条命中</div>`).join('');
    card.innerHTML = `
      <h4>${live ? '<span class="dot"></span>' : ''}第${b.agentId}棒 ${live ? '· 当前在棒' : '· 已离场'}</h4>
      <div class="bs-sub">输入 = ${b.agentId === 1 ? '（第一棒，无简报）' : '第' + (b.agentId-1) + '棒简报（' + (b.prevHandoff || '').length + ' 字）'} + 用户消息</div>
      ${qHtml}
      <details class="bs-detail"><summary>看它留下的工作简报（下一棒的全部世界）</summary><div class="bs-pre">${fmt(b.handoff || '（第一棒）')}</div></details>
      <details class="bs-detail"><summary>看它读到的完整输入</summary><div class="bs-pre">【用户消息】\n${esc(b.userMessage)}\n\n【工作简报】\n${fmt(b.prevHandoff || '（无，第一棒）')}</div></details>
      ${b.rejected ? '<div class="bs-meta">⛔ 简报未过基底校验（已重派，仍不过则兜底重写）：' + esc((b.validation && b.validation.errors || []).map(e => e.msg).join('；') || '未知原因') + '</div>' : ''}${b.degraded ? '<div class="bs-meta">⚠ 本棒格式降级，简报为兜底生成</div>' : ''}${b.salvaged ? '<div class="bs-meta">⚠ 本棒输出截断，正文已自动抢救</div>' : ''}`;
    list.appendChild(card);
  }
}

// ---------- 发送一轮 ----------
async function sendTurn(text) {
  busy = true; sendBtn.disabled = true;
  if (!sid) {
    try {
      const r = await fetch('/api/session', { method: 'POST' });
      const d = await r.json();
      sid = d.sid; localStorage.setItem('theseus_sid', sid);
    } catch {}
  }
  const agentId = batons.length + 1;
  const isRelay = mode === 'relay';
  if (isRelay && batons.length) {
    logEl.appendChild(renderDivider(agentId, (batons[batons.length - 1].handoff || '').length));
  }
  logEl.querySelector('.empty')?.remove();
  logEl.appendChild(renderMsg('user', agentId, text, '', mode));
  scrollBottom();

  const thinking = renderMsg('bot', agentId, '…', '', mode);
  const bubble = thinking.querySelector('.bubble');
  bubble.textContent = !isRelay ? '常驻助手思考中…'
    : agentId === 1 ? '第 1 棒船员上船中…' : `第 ${agentId-1} 棒写交接中 → 第 ${agentId} 棒接棒…`;
  logEl.appendChild(thinking); scrollBottom();

  try {
    const res = await fetch('/api/turn', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid, message: text, mode, profile: profile && profile.apiKey ? profile : undefined }),
    });
    const data = await safeJson(res);
    if (!res.ok) throw new Error(data.error || '请求失败');
    if (!sid) { sid = data.sid || sid; localStorage.setItem('theseus_sid', sid); }

    thinking.remove();
    let extra = '';
    for (const q of data.logQueries || []) extra += `<span class="chip">翻日志：「${esc(q.query)}」命中 ${q.hits.length} 条</span>`;
    if (data.degraded) extra += '<span class="chip warn">本棒输出降级</span>';
    if (data.rejected) extra += '<span class="chip warn">简报未过基底校验：' + esc((data.validation && data.validation.errors || []).map(e => e.msg).join('；') || '未知原因') + '</span>';
    if (data.salvaged) extra += '<span class="chip warn">输出截断，已自动抢救正文</span>';
    const respMode = data.mode || 'relay';
    logEl.appendChild(renderMsg('bot', data.agentId, data.reply, extra, respMode));
    scrollBottom();
  } catch (e) {
    thinking.remove();
    logEl.appendChild(renderMsg('bot', agentId, '⚠ ' + e.message, '', mode));
    scrollBottom();
  } finally {
    await restoreState();
    busy = false; sendBtn.disabled = false;
  }
}

async function restoreState() {
  if (!sid) return;
  try {
    const m = profile && profile.model ? '&model=' + encodeURIComponent(profile.model) : '';
    const res = await fetch('/api/state?sid=' + encodeURIComponent(sid) + m);
    if (!res.ok) return;
    const s = await res.json();
    batons = s.batons || [];
    renderBackstage();
    renderCost(s.cost);
  } catch {}
}

// ---------- 成本双账本（v0.1.2） ----------
// 接力实付 vs「同题单体架构」的模拟花费。短会话接力多半输，长会话才赢——输了也如实显示。
function money(v) {
  if (!isFinite(v)) return '—';
  if (v === 0) return '$0';
  if (v < 0.0001) return '$' + v.toFixed(6);
  if (v < 0.01) return '$' + v.toFixed(5);
  return '$' + v.toFixed(4);
}

function renderCost(cost) {
  const panel = $('#costPanel');
  if (!cost || !cost.turns) { panel.hidden = true; return; }
  panel.hidden = false;
  const r = cost.relay.cost, sg = cost.single.cost, d = r - sg;
  $('#costRelay').textContent = money(r);
  $('#costSingle').textContent = money(sg);
  const dEl = $('#costDelta');
  dEl.textContent = (d <= 0 ? '接力省 ' : '接力多花 ') + money(Math.abs(d));
  dEl.className = d <= 0 ? 'good' : 'bad';
  $('#costModel').textContent = (cost.price && cost.price.label || '') + (cost.price && cost.price.unknown ? ' · 价目按默认档估算' : '');
  $('#costNote').textContent =
    `${cost.turns} 棒 · 接力 in/out ${cost.relay.in}/${cost.relay.out} tok · 完整 log ${cost.logChars} 字（单体每棒都要重读它）`
    + (cost.estimated ? ' · 部分 token 按字符估算' : '');

  const max = Math.max(r, sg, 1e-9);
  const n = cost.series.length;
  const pts = (k) => cost.series.map((p, i) => {
    const x = 6 + (n > 1 ? (i / (n - 1)) * 248 : 0);
    const y = 84 - (p[k] / max) * 72;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  $('#costChart').innerHTML =
    `<polyline points="${pts('single')}" fill="none" stroke="var(--red)" stroke-width="1.6" stroke-dasharray="3 2"/>`
    + `<polyline points="${pts('relay')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
}

// ---------- 会话初始化 ----------
async function init() {
  // 恢复历史聊天
  if (sid) {
    try {
      const res = await fetch('/api/state?sid=' + encodeURIComponent(sid));
      if (res.ok) {
        const s = await res.json();
        batons = s.batons || [];
        mode = 'relay';
        if ((s.log || []).length) {
          logEl.querySelector('.empty')?.remove();
          let lastRelayAgent = 0;
          let lastHandoffLen = null;
          for (const e of s.log || []) {
            if (e.mode !== 'single' && e.role === 'user' && e.agentId !== lastRelayAgent) {
              lastRelayAgent = e.agentId;
              if (lastRelayAgent > 1) logEl.appendChild(renderDivider(lastRelayAgent, lastHandoffLen));
            }
            if (e.role === 'assistant' && e.mode !== 'single') {
              const b = (s.batons || []).find(x => x.agentId === e.agentId);
              lastHandoffLen = b ? (b.handoff || '').length : null;
            }
            logEl.appendChild(renderMsg(e.role, e.agentId, e.text, '', e.mode || 'relay'));
          }
          scrollBottom();
        }
      }
    } catch {}
  }
  renderBackstage();
  await restoreState(); // 顺带拉一次 state，渲染成本双账本

  // 内置通道探测 + 后端连通性
  try {
    const r = await fetch('/api/default-profile');
    builtin = await r.json();
    backendOk = true;
    if (builtin.builtin) {
      const note = $('#builtinNote');
      note.style.display = 'block';
      note.textContent = `本站已开启内置通道（${builtin.model || '默认模型'}），无需配置即可直接体验。`;
      if (!profile) { $('#mask').classList.remove('open'); return; }
    }
  } catch {
    backendOk = false;
    logEl.innerHTML = '<div class="empty"><b>⚠ 后端服务未连接</b><p>当前页面是静态打开的（没有后端）。请通过发布的链接访问，或在项目目录运行 <b>node server.js</b> 后打开 http://localhost:3000</p></div>';
  }
  if (backendOk && (!profile || !profile.apiKey)) openSettings();
}

// ---------- 设置 ----------
async function openSettings() {
  const mask = $('#mask');
  mask.classList.add('open');
  if (!$('#fProvider').options.length) {
    let presets = null;
    try {
      const r = await fetch('/api/providers');
      if (r.ok) presets = await r.json();
    } catch {}
    if (!presets || !Object.keys(presets).length) {
      presets = FALLBACK_PRESETS;
      if (!backendOk) toast('后端未连接：使用内置预设，但无法对话');
    }
    const sel = $('#fProvider');
    for (const [k, v] of Object.entries(presets)) {
      const o = document.createElement('option');
      o.value = k; o.textContent = v.label; o.dataset.base = v.baseUrl; o.dataset.models = JSON.stringify(v.models || []);
      sel.appendChild(o);
    }
    if (profile) {
      sel.value = profile.provider || 'deepseek';
      applyProvider();
      $('#fBase').value = profile.baseUrl || '';
      $('#fModel').value = profile.model || '';
      $('#fKey').value = profile.apiKey || '';
    }
  }
}
function applyProvider() {
  const o = $('#fProvider').selectedOptions[0];
  if (!o) return;
  $('#fBase').value = o.dataset.base || '';
  const models = JSON.parse(o.dataset.models || '[]');
  $('#modelList').innerHTML = models.map(m => `<option value="${esc(m)}">`).join('');
  if (models.length) $('#fModel').value = models[0];
}
$('#fProvider').addEventListener('change', applyProvider);

// 安全解析：代理超时/断连时 body 可能为空，直接 res.json() 会炸
async function safeJson(res) {
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch {
    throw new Error(`服务端无有效响应（HTTP ${res.status}）${res.status === 504 || res.status === 502 ? '，大概率是请求超时，请重试' : ''}`);
  }
}

$('#btnTest').addEventListener('click', async () => {
  const el = $('#testResult');
  el.className = ''; el.textContent = '测试中…';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch('/api/test', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ baseUrl: $('#fBase').value.trim(), apiKey: $('#fKey').value.trim(), model: $('#fModel').value.trim() }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    const d = await safeJson(r);
    if (d.ok) { el.className = 'ok'; el.textContent = '连接成功：' + d.reply; }
    else { el.className = 'bad'; el.textContent = '失败：' + d.error; }
  } catch (e) {
    clearTimeout(timer);
    el.className = 'bad';
    el.textContent = e.name === 'AbortError' ? '失败：30 秒无响应，检查 Base URL/模型名或换服务商' : '失败：' + e.message;
  }
});

$('#btnSave').addEventListener('click', () => {
  const base = $('#fBase').value.trim(), model = $('#fModel').value.trim(), key = $('#fKey').value.trim();
  if (!base || !model) return toast('Base URL 和模型不能为空');
  profile = { provider: $('#fProvider').value, baseUrl: base, model, apiKey: key };
  localStorage.setItem('theseus_profile', JSON.stringify(profile));
  $('#mask').classList.remove('open');
  toast('已保存，开始接棒吧');
});

// ---------- 事件 ----------
sendBtn.addEventListener('click', () => {
  const t = inputEl.value.trim();
  if (!t || busy) return;
  if (!profile?.apiKey && !builtin?.builtin) return openSettings();
  inputEl.value = ''; inputEl.style.height = 'auto';
  sendTurn(t);
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
document.querySelectorAll('.qbtn').forEach(b => b.addEventListener('click', () => {
  if (busy) return;
  inputEl.value = b.dataset.q;
  sendBtn.click();
}));
$('#btnBackstage').addEventListener('click', () => {
  $('#backstage').classList.toggle('open');
  $('#btnBackstage').classList.toggle('active');
});
$('#btnSettings').addEventListener('click', openSettings);
$('#mask').addEventListener('click', (e) => {
  if (e.target === $('#mask') && (profile?.apiKey || builtin?.builtin)) $('#mask').classList.remove('open');
});
// 两次点击确认（沙箱 iframe 内原生 confirm() 被拦截，不可用）
let resetArmed = false, resetTimer = null;
$('#btnReset').addEventListener('click', async () => {
  if (!sid) return toast('还没有开始对局');
  if (!resetArmed) {
    resetArmed = true;
    $('#btnReset').textContent = '确认清空？';
    $('#btnReset').classList.add('active');
    resetTimer = setTimeout(() => {
      resetArmed = false;
      $('#btnReset').textContent = '重开一局';
      $('#btnReset').classList.remove('active');
    }, 3000);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false;
  $('#btnReset').textContent = '重开一局';
  $('#btnReset').classList.remove('active');
  try { await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sid }) }); } catch {}
  mode = 'relay';
  location.reload();
});

init();
</script>
</body>
